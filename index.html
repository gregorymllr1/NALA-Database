<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NALA R&D Data Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        .log-window::-webkit-scrollbar { width: 8px; }
        .log-window::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .log-window::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .log-window::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .chart-legend::-webkit-scrollbar { width: 8px; }
        .chart-legend::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .chart-legend::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .chart-legend::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        #log-drawer {
            transition: transform 0.25s cubic-bezier(0.4,0,0.2,1), opacity 0.25s ease;
            transform: translateY(calc(100% + 1rem));
            opacity: 0;
            pointer-events: none;
        }
        #log-drawer.open {
            transform: translateY(0);
            opacity: 1;
            pointer-events: all;
        }
        #log-fab {
            box-shadow: 0 4px 24px rgba(0,0,0,0.18);
        }

        /* Database status card */
        .db-card-gradient {
            background: linear-gradient(135deg, #ffffff 0%, #f0f2f5 100%);
        }
        .db-badge-loading {
            background-color: #94a3b8;
        }
        .db-badge-ready {
            background-color: #22c55e;
            box-shadow: 0 0 15px 4px rgba(34, 197, 94, 0.4);
        }
        .db-badge-notready {
            background-color: #dc2626;
            box-shadow: 0 0 20px 5px rgba(239, 68, 68, 0.4);
        }
        .db-bar-loading {
            background-color: #cbd5e1;
        }
        .db-bar-ready {
            background-color: #22c55e;
        }
        .db-bar-notready {
            background-color: #dc2626;
        }
        .db-inset-btn {
            box-shadow: inset 1px 1px 3px rgba(255,255,255,0.9), inset -1px -1px 3px rgba(0,0,0,0.1), 1px 1px 4px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans h-screen flex overflow-hidden">

    <div class="w-96 bg-white border-r border-slate-200 shadow-sm flex flex-col h-full z-10">
        <div class="p-6 border-b border-slate-100 flex items-center space-x-3 bg-blue-50">
            <i data-lucide="flask-conical" class="text-blue-600"></i>
            <h1 class="text-xl font-bold text-slate-800">NALA Explorer</h1>
        </div>

        <div class="p-6 overflow-y-auto flex-1 space-y-6">
            
            <div class="space-y-2">
                <label class="block text-sm font-semibold text-slate-700">1. Database Status</label>
                <!-- Status Card -->
                <div class="db-card-gradient border border-slate-200 rounded-xl p-5">
                    <!-- Badge -->
                    <div class="flex justify-center mb-4">
                        <div id="db-status-badge" class="db-badge-loading text-white font-bold px-6 py-2 rounded-xl text-sm tracking-wide">
                            LOADING...
                        </div>
                    </div>
                    <!-- Progress Bar -->
                    <div class="w-full bg-gray-200 rounded-full h-3 mb-4 overflow-hidden shadow-inner">
                        <div id="db-status-bar" class="db-bar-loading h-3 rounded-full w-full transition-colors duration-500"></div>
                    </div>
                    <!-- Footer: DB info + refresh -->
                    <div class="flex justify-between items-end">
                        <div class="space-y-1.5">
                            <div class="flex items-center gap-2 text-slate-600 text-xs font-medium">
                                <svg class="h-4 w-4 shrink-0" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M3 12v3c0 1.657 3.134 3 7 3s7-1.343 7-3v-3c0 1.657-3.134 3-7 3s-7-1.343-7-3z"/>
                                    <path d="M3 7v3c0 1.657 3.134 3 7 3s7-1.343 7-3V7c0 1.657-3.134 3-7 3S3 8.657 3 7z"/>
                                    <path d="M17 4c0 1.657-3.134 3-7 3S3 5.657 3 4s3.134-3 7-3 7 1.343 7 3z"/>
                                </svg>
                                <span id="db-name-text">nala_rd_data.db</span>
                            </div>
                            <div class="flex items-center gap-2 text-slate-600 text-xs font-medium">
                                <svg class="h-4 w-4 shrink-0" fill="currentColor" viewBox="0 0 20 20">
                                    <path clip-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" fill-rule="evenodd"/>
                                </svg>
                                <span id="db-size-text">— KB</span>
                            </div>
                        </div>
                        <!-- Refresh Button -->
                        <button id="refresh-db-btn" title="Re-fetch latest database" class="w-9 h-9 flex items-center justify-center bg-gray-100 border border-gray-300 rounded-lg db-inset-btn hover:bg-gray-200 transition-colors">
                            <svg class="h-4 w-4 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <div class="space-y-4">
                <label class="block text-sm font-semibold text-slate-700 border-b pb-2">2. Search Parameters</label>
                
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">Search Terms (Comma separated — supports <code>*</code>, <code>?</code>, and <code>A13639..A13663</code> ranges)</label>
                    <input type="text" id="search-term" value="7GR1, 7GR25" title="Comma-separated terms (OR logic). Wildcards: * = any chars, ? = one char. Range: prefix+number..prefix+number, e.g. A13639..A13663" class="w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                </div>

                <div class="relative z-20">
                    <label class="block text-xs font-medium text-slate-500 mb-1">Instrument Filter (Multi-Select)</label>
                    <button id="instrument-dropdown-btn" class="w-full text-left px-3 py-2 border border-slate-300 rounded-md shadow-sm bg-white focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm text-slate-700 flex justify-between items-center">
                        <span id="instrument-btn-text" class="truncate pr-2">None (No Filter)</span>
                        <i data-lucide="chevron-down" class="h-4 w-4 text-slate-400 shrink-0"></i>
                    </button>
                    <div id="instrument-dropdown-panel" class="hidden absolute left-0 right-0 mt-1 bg-white border border-slate-300 rounded-md shadow-lg">
                        <div id="instrument-list" class="p-2 space-y-1 bg-slate-50">
                            <label class="flex items-center px-2 py-1 hover:bg-slate-100 rounded cursor-pointer">
                                <input type="checkbox" value="none" class="instrument-checkbox h-4 w-4 text-blue-600 focus:ring-blue-500 border-slate-300 rounded mr-2" checked>
                                <span class="text-xs text-slate-700">None</span>
                            </label>
                            <label class="flex items-center px-2 py-1 hover:bg-slate-100 rounded cursor-pointer">
                                <input type="checkbox" value="nammu" class="instrument-checkbox h-4 w-4 text-blue-600 focus:ring-blue-500 border-slate-300 rounded mr-2">
                                <span class="text-xs text-slate-700">Nammu</span>
                            </label>
                            <label class="flex items-center px-2 py-1 hover:bg-slate-100 rounded cursor-pointer">
                                <input type="checkbox" value="neptune" class="instrument-checkbox h-4 w-4 text-blue-600 focus:ring-blue-500 border-slate-300 rounded mr-2">
                                <span class="text-xs text-slate-700">Neptune</span>
                            </label>
                            <label class="flex items-center px-2 py-1 hover:bg-slate-100 rounded cursor-pointer">
                                <input type="checkbox" value="poseidon" class="instrument-checkbox h-4 w-4 text-blue-600 focus:ring-blue-500 border-slate-300 rounded mr-2">
                                <span class="text-xs text-slate-700">Poseidon</span>
                            </label>
                            <label class="flex items-center px-2 py-1 hover:bg-slate-100 rounded cursor-pointer">
                                <input type="checkbox" value="phoenix" class="instrument-checkbox h-4 w-4 text-blue-600 focus:ring-blue-500 border-slate-300 rounded mr-2">
                                <span class="text-xs text-slate-700">Phoenix</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="relative z-20">
                    <label class="block text-xs font-medium text-slate-500 mb-1">Feed Solution Filter (Multi-Select)</label>
                    <button id="feed-dropdown-btn" class="w-full text-left px-3 py-2 border border-slate-300 rounded-md shadow-sm bg-white focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm text-slate-700 flex justify-between items-center">
                        <span id="feed-btn-text" class="truncate pr-2">Load DB to populate...</span>
                        <i data-lucide="chevron-down" class="h-4 w-4 text-slate-400 shrink-0"></i>
                    </button>
                    <div id="feed-dropdown-panel" class="hidden absolute left-0 right-0 mt-1 bg-white border border-slate-300 rounded-md shadow-lg max-h-60 flex flex-col">
                        <div class="p-2 border-b border-slate-200 flex space-x-2">
                            <input type="text" id="feed-search" placeholder="Search..." class="flex-1 px-2 py-1 text-sm border border-slate-300 rounded-md focus:outline-none focus:border-blue-500">
                            <button id="feed-clear-btn" class="px-3 py-1 text-xs font-medium text-slate-600 bg-slate-100 border border-slate-300 rounded-md hover:bg-slate-200 transition-colors shadow-sm focus:outline-none">Clear</button>
                        </div>
                        <div id="feed-list" class="overflow-y-auto p-2 space-y-1 flex-1 bg-slate-50">
                            <div class="text-xs text-slate-500 italic px-2 py-1">Please select a .db file first.</div>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">X-Axis</label>
                    <select id="x-axis-select" class="w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm text-slate-700 bg-white">
                        <option value="time_elapsed" selected>Time Elapsed</option>
                        <option value="flux">Flux</option>
                        <option value="rejection">Rejection</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">Y-Axis</label>
                    <select id="y-axis-select" class="w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm text-slate-700 bg-white">
                        <option value="flux" selected>Flux</option>
                        <option value="rejection">Rejection</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">Exclude/Poison Words (Ignore rows with these)</label>
                    <input type="text" id="exclude-words" value="date, install, prep, system, clock" class="w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm text-slate-700">
                </div>
            </div>
        </div>

        <div class="p-6 border-t border-slate-200 bg-slate-50">
            <div class="grid grid-cols-2 gap-3">
                <button id="analyze-btn" class="w-full flex justify-center items-center py-2.5 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                    <i data-lucide="line-chart" class="mr-2 h-4 w-4"></i>
                    Analyze & Plot
                </button>
                <button id="export-csv-btn" disabled class="w-full flex justify-center items-center py-2.5 px-4 border border-slate-300 rounded-md shadow-sm text-sm font-medium text-slate-500 bg-slate-100 hover:bg-slate-200 focus:outline-none transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                    <i data-lucide="download" class="mr-2 h-4 w-4"></i>
                    Export CSV
                </button>
            </div>
        </div>
    </div>

    <div class="flex-1 flex flex-col h-full bg-slate-100 p-6 overflow-hidden">
        
        <div id="chart-container" class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex-1 flex flex-col relative min-h-0">
            <h2 id="chart-title" class="text-lg font-bold text-slate-800 mb-4 text-center">Awaiting Data...</h2>
            <div class="w-full flex-1 min-h-0 flex gap-4 overflow-hidden">
                <div class="relative flex-1 min-w-0 min-h-0">
                    <canvas id="mainChart"></canvas>
                </div>
                <div class="w-[320px] max-w-[35%] min-w-[260px] border border-slate-200 rounded-lg bg-slate-50 p-3 flex flex-col min-h-0">
                    <h3 class="text-xs font-semibold text-slate-600 uppercase tracking-wide mb-2">Experiment Source</h3>
                    <div id="chart-legend" class="chart-legend flex-1 overflow-y-auto space-y-1 pr-1"></div>
                </div>
            </div>
        </div>

        <div id="element-data-panel" class="hidden bg-white rounded-xl shadow-sm border border-slate-200 p-6 mt-4 flex-1 flex flex-col min-h-0">
            <h2 id="element-title" class="text-lg font-bold text-slate-800 mb-4 text-center">Element Performance</h2>
            <div id="element-table-container" class="overflow-auto flex-1 min-h-0">
            </div>
        </div>

    </div>

    <!-- Floating Log Drawer -->
    <div id="log-drawer" class="fixed bottom-20 right-6 w-[480px] max-w-[calc(100vw-3rem)] bg-slate-900 rounded-xl shadow-2xl border border-slate-700 font-mono text-sm overflow-hidden z-50">
        <div class="bg-slate-800 px-4 py-2.5 border-b border-slate-700 flex justify-between items-center">
            <div class="flex items-center text-slate-300 font-semibold">
                <i data-lucide="terminal" class="mr-2 h-4 w-4"></i>
                Extraction Logs
            </div>
            <div class="flex items-center gap-3">
                <button id="clear-log-btn" class="text-xs text-slate-400 hover:text-white transition-colors">Clear</button>
                <button id="log-close-btn" class="text-slate-400 hover:text-white transition-colors" title="Close">
                    <i data-lucide="x" class="h-4 w-4"></i>
                </button>
            </div>
        </div>
        <div id="log-window" class="p-4 overflow-y-auto log-window text-slate-300 space-y-1" style="height: 260px;">
            <p class="text-blue-400">> System Ready. Fetching database...</p>
        </div>
    </div>

    <!-- Floating Log Toggle Button -->
    <button id="log-fab" class="fixed bottom-6 right-6 z-50 flex items-center gap-2 px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-full shadow-lg transition-colors text-sm font-medium border border-slate-600">
        <i data-lucide="terminal" class="h-4 w-4"></i>
        <span id="log-fab-label">Logs</span>
        <span id="log-fab-badge" class="hidden ml-1 h-2 w-2 rounded-full bg-green-400"></span>
    </button>

    <script>
        lucide.createIcons();

        let sqlPromise = null;
        let dbInstance = null;
        let chartInstance = null;
        let lastRenderedDatasets = [];
        let lastElementDatasets = [];
        let lastXLabel = '';
        let lastYLabel = '';

        const analyzeBtn = document.getElementById('analyze-btn');
        const dbStatusBadge = document.getElementById('db-status-badge');
        const dbStatusBar = document.getElementById('db-status-bar');
        const dbSizeText = document.getElementById('db-size-text');
        const refreshDbBtn = document.getElementById('refresh-db-btn');

        function setDbStatus(state, sizeKB) {
            const badge = dbStatusBadge;
            const bar = dbStatusBar;
            badge.className = 'text-white font-bold px-6 py-2 rounded-xl text-sm tracking-wide';
            bar.className = 'h-3 rounded-full w-full transition-colors duration-500';
            if (state === 'ready') {
                badge.textContent = 'READY';
                badge.classList.add('db-badge-ready');
                bar.classList.add('db-bar-ready');
                if (sizeKB) dbSizeText.textContent = sizeKB + ' KB';
            } else if (state === 'notready') {
                badge.textContent = 'NOT READY';
                badge.classList.add('db-badge-notready');
                bar.classList.add('db-bar-notready');
            } else {
                badge.textContent = 'LOADING...';
                badge.classList.add('db-badge-loading');
                bar.classList.add('db-bar-loading');
            }
        }

        // ── Set this URL to your database file ────────────────────────────────────
        // For GitHub Pages, use the raw file URL, e.g.:
        // 'https://raw.githubusercontent.com/YOUR_ORG/NALA-Database/main/nala_rd_data.db'
        const DB_URL = 'https://data.naladatabase.us/nala_rd_data.db';
        const exportCsvBtn = document.getElementById('export-csv-btn');
        const logWindow = document.getElementById('log-window');
        const chartTitle = document.getElementById('chart-title');
        
        const searchTermEl = document.getElementById('search-term');
        const instrumentDropdownBtn = document.getElementById('instrument-dropdown-btn');
        const instrumentDropdownPanel = document.getElementById('instrument-dropdown-panel');
        const instrumentBtnText = document.getElementById('instrument-btn-text');
        const instrumentList = document.getElementById('instrument-list');
        const xAxisSelectEl = document.getElementById('x-axis-select');
        const yAxisSelectEl = document.getElementById('y-axis-select');
        const excludeWordsEl = document.getElementById('exclude-words');

        const INSTRUMENT_LABELS = {
            nammu: 'Nammu',
            neptune: 'Neptune',
            poseidon: 'Poseidon',
            phoenix: 'Phoenix'
        };

        const X_AXIS_OPTIONS = {
            time_elapsed: {
                label: 'Time Elapsed',
                keywords: ['elapsed', 'run time', 'time (h)', 'time', 'time (hrs)']
            },
            flux: {
                label: 'Flux',
                keywords: ['flux']
            },
            rejection: {
                label: 'Rejection',
                keywords: ['rejection']
            }
        };

        const Y_AXIS_OPTIONS = {
            flux: {
                label: 'Flux',
                keywords: ['flux']
            },
            rejection: {
                label: 'Rejection',
                keywords: ['rejection']
            }
        };

        function getSelectedInstrumentTerms() {
            return Array.from(instrumentList.querySelectorAll('.instrument-checkbox:checked'))
                .map(cb => cb.value)
                .filter(v => v !== 'none');
        }

        function getSelectedInstrumentLabel() {
            const selected = getSelectedInstrumentTerms();
            if (selected.length === 0) return 'None';
            return selected.map(v => INSTRUMENT_LABELS[v] || v).join(', ');
        }

        function syncInstrumentButtonText() {
            const selected = getSelectedInstrumentTerms();
            if (selected.length === 0) {
                instrumentBtnText.innerText = 'None (No Filter)';
            } else if (selected.length <= 2) {
                instrumentBtnText.innerText = selected.map(v => INSTRUMENT_LABELS[v] || v).join(', ');
            } else {
                instrumentBtnText.innerText = `${selected.length} Instruments Selected`;
            }
        }

        document.getElementById('clear-log-btn').addEventListener('click', () => {
            logWindow.innerHTML = '<p class="text-blue-400">> Logs cleared.</p>';
        });

        // --- Floating log drawer toggle ---
        const logDrawer = document.getElementById('log-drawer');
        const logFab = document.getElementById('log-fab');
        const logFabLabel = document.getElementById('log-fab-label');
        const logFabBadge = document.getElementById('log-fab-badge');
        let logDrawerOpen = false;
        let logHasNew = false;

        function toggleLogDrawer() {
            logDrawerOpen = !logDrawerOpen;
            logDrawer.classList.toggle('open', logDrawerOpen);
            logFabLabel.textContent = logDrawerOpen ? 'Close Logs' : 'Logs';
            if (logDrawerOpen) {
                logHasNew = false;
                logFabBadge.classList.add('hidden');
                logWindow.scrollTop = logWindow.scrollHeight;
            }
        }

        logFab.addEventListener('click', toggleLogDrawer);
        document.getElementById('log-close-btn').addEventListener('click', toggleLogDrawer);

        // --- log() ---

        function log(message, type = 'info') {
            const p = document.createElement('p');
            if (type === 'error') p.className = 'text-red-400';
            else if (type === 'success') p.className = 'text-green-400';
            else if (type === 'warn') p.className = 'text-yellow-400';
            else p.className = 'text-slate-300';
            p.textContent = `> ${message}`;
            logWindow.appendChild(p);
            logWindow.scrollTop = logWindow.scrollHeight;
            if (!logDrawerOpen) {
                logHasNew = true;
                logFabBadge.classList.remove('hidden');
            }
        }

        log("Downloading SQL engine (WebAssembly)...");
        const config = {
            locateFile: filename => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${filename}`
        };
        
        initSqlJs(config).then(function(SQL){
            sqlPromise = SQL;
            log("SQL engine loaded successfully.", "success");
            fetchDatabase();
        }).catch(err => {
            log(`Failed to load SQL engine: ${err.message}`, "error");
        });

        async function fetchDatabase() {
            if (!sqlPromise) {
                log("SQL engine is still loading. Please wait...", "warn");
                return;
            }
            setDbStatus('loading');
            log("Fetching database from remote URL...");

            try {
                const response = await fetch(DB_URL, { cache: 'no-cache' });
                if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                const buffer = await response.arrayBuffer();
                const Uints = new Uint8Array(buffer);
                if (dbInstance) dbInstance.close();
                dbInstance = new sqlPromise.Database(Uints);
                setDbStatus('ready', (buffer.byteLength / 1024).toFixed(0));
                log("Database fetched and loaded successfully!", "success");
                populateFeedSolutions();
            } catch (err) {
                setDbStatus('notready');
                log(`Error fetching database: ${err.message}`, "error");
                log(`Ensure DB_URL is set correctly in the script and the file is publicly accessible.`, "warn");
            }
        }

        refreshDbBtn.addEventListener('click', fetchDatabase);

        function parseKeywords(rawString) {
            return rawString.split(',').map(s => s.trim().toLowerCase()).filter(s => s.length > 0);
        }

        // Compile a single Search Term into a matcher object.
        // Supports: exact match, * (any chars), ? (one char), and "prefixN..prefixM" numeric ranges.
        // Each matcher exposes { raw, kind, test(haystack) } where haystack is searched case-insensitively.
        function compileSearchTerm(term) {
            const escapeRegex = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

            if (term.includes('..')) {
                const parts = term.split('..');
                if (parts.length === 2) {
                    const left  = parts[0].trim();
                    const right = parts[1].trim();
                    const m1 = left.match(/^(.*?)(\d+)$/);
                    const m2 = right.match(/^(.*?)(\d+)$/);
                    if (m1 && m2 && m1[1].toLowerCase() === m2[1].toLowerCase()) {
                        const prefix = m1[1];
                        const lo = Math.min(parseInt(m1[2], 10), parseInt(m2[2], 10));
                        const hi = Math.max(parseInt(m1[2], 10), parseInt(m2[2], 10));
                        const rx = new RegExp(`(^|[^a-z0-9])(${escapeRegex(prefix)})(\\d+)(?=[^a-z0-9]|$)`, 'gi');
                        return {
                            raw: term,
                            kind: 'range',
                            test(haystack) {
                                rx.lastIndex = 0;
                                let m;
                                while ((m = rx.exec(String(haystack))) !== null) {
                                    const n = parseInt(m[3], 10);
                                    if (n >= lo && n <= hi) return true;
                                }
                                return false;
                            }
                        };
                    }
                }
                // Malformed range falls through to exact-match below
            }

            if (term.includes('*') || term.includes('?')) {
                // Escape everything except * and ?, then translate wildcards.
                // * = any run of alphanumerics, ? = exactly one alphanumeric.
                const pattern = term
                    .replace(/[.+^${}()|[\]\\]/g, '\\$&')
                    .replace(/\*/g, '[a-z0-9]*')
                    .replace(/\?/g, '[a-z0-9]');
                const rx = new RegExp(`(^|[^a-z0-9])${pattern}(?=[^a-z0-9]|$)`, 'i');
                return { raw: term, kind: 'wildcard', test: (h) => rx.test(String(h)) };
            }

            const rx = new RegExp(`(^|[^a-z0-9])${escapeRegex(term)}([^a-z0-9]|$)`, 'i');
            return { raw: term, kind: 'exact', test: (h) => rx.test(String(h)) };
        }

        function compileSearchTerms(rawString) {
            return rawString
                .split(',')
                .map(s => s.trim())
                .filter(s => s.length > 0)
                .map(compileSearchTerm);
        }

        function extractNumber(val) {
            if (val === null || val === undefined || val === '') return null;
            const strVal = String(val).replace(/,/g, '');
            const match = strVal.match(/([-+]?\d*\.?\d+(?:[eE][-+]?\d+)?)/);
            if (match) return parseFloat(match[1]);
            return null;
        }

        const ELEMENT_METRIC_KEYWORDS = ['serial #', 'cell #', 'sqft', 'recovery', 'temp', 'psi', 'cond', 'tds ppm', 'sr%', 'gpm', 'gpd', 'gfd', 'lmh', 'lmh/bar', 'gpm/psi', 'date tested'];
        const ELEMENT_DISPLAY_COLUMNS = ['Serial #', 'Cell #', 'Date Tested', 'sqft', 'psi', 'Temp', 'Recovery', 'Cond', 'TDS ppm', 'SR%', 'gpm', 'gpd', 'gfd', 'lmh', 'lmh/bar', 'gpm/psi'];

        function isSummaryGraphTable(tableName) {
            // The "Summary Graph" worksheet is a derived chart tab built from the
            // other sheets, not raw measurement data. Its table name still contains
            // the lot numbers, so it matches Search Terms and gets plotted as an
            // unwanted extra line — exclude it from analysis entirely.
            return /summary[_ ]*graph/i.test(tableName);
        }

        function isElementPerformanceTable(tableName, values) {
            if (/performance_calc/i.test(tableName)) return true;
            const probeKeys = ['serial #', 'sr%', 'lmh', 'gfd', 'gpm'];
            for (let r = 0; r < Math.min(values.length, 10); r++) {
                let hits = 0;
                for (let c = 0; c < values[r].length; c++) {
                    if (probeKeys.includes(String(values[r][c]).toLowerCase().trim())) hits++;
                }
                if (hits >= 3) return true;
            }
            return false;
        }

        function extractElementData(values) {
            const records = [];
            const foundMetrics = new Set();

            for (let r = 0; r < values.length; r++) {
                const colMap = {};
                let hits = 0;
                for (let c = 0; c < values[r].length; c++) {
                    const cell = String(values[r][c]).toLowerCase().trim();
                    if (ELEMENT_METRIC_KEYWORDS.includes(cell)) {
                        colMap[cell] = c;
                        hits++;
                    }
                }
                if (hits < 3) continue;

                const keyMetrics = ['sr%', 'lmh', 'gfd'];
                for (let dr = r + 1; dr < values.length; dr++) {
                    const row = values[dr];
                    const record = {};
                    let hasKeyMetric = false;

                    for (const [metric, colIdx] of Object.entries(colMap)) {
                        const raw = row[colIdx];
                        const str = String(raw ?? '').trim();
                        if (!str || str === 'null' || str.startsWith('#DIV')) {
                            record[metric] = null;
                            continue;
                        }
                        record[metric] = str;
                        if (keyMetrics.includes(metric)) {
                            const num = extractNumber(raw);
                            if (num !== null && num !== 0) hasKeyMetric = true;
                        }
                    }

                    if (!hasKeyMetric) break;
                    Object.keys(colMap).forEach(k => foundMetrics.add(k));
                    records.push(record);
                }
            }
            return { records, metrics: Array.from(foundMetrics) };
        }

        function formatLegendLabel(rawName, truncate = true) {
            let cleanName = rawName.replace('tbl_', '');
            cleanName = cleanName.replace(/^_+/, '');
            cleanName = cleanName.replace(/_/g, ' ');
            if (truncate) return cleanName.length > 45 ? cleanName.substring(0, 45) + '...' : cleanName;
            return cleanName;
        }

        function resetRenderedDataState() {
            lastRenderedDatasets = [];
            lastElementDatasets = [];
            lastXLabel = '';
            lastYLabel = '';
            exportCsvBtn.disabled = true;
        }

        function escapeCsvValue(value) {
            const str = String(value ?? '');
            if (str.includes('"') || str.includes(',') || str.includes('\n')) {
                return `"${str.replace(/"/g, '""')}"`;
            }
            return str;
        }

        function buildExportFileName() {
            const safeTitle = (chartTitle.textContent || 'nala_results')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '_')
                .replace(/^_+|_+$/g, '')
                .slice(0, 60);
            const datePart = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
            return `${safeTitle || 'nala_results'}_${datePart}.csv`;
        }

        function exportRenderedDataToCsv() {
            if (!lastRenderedDatasets.length && !lastElementDatasets.length) {
                log('No data available to export.', 'warn');
                return;
            }

            let rows = [];

            if (lastRenderedDatasets.length) {
                const header = ['series', 'x_axis', 'x_value', 'y_axis', 'y_value'];
                rows.push(header.join(','));
                lastRenderedDatasets.forEach((dataset) => {
                    const series = dataset.fullLabel || dataset.label || '';
                    (dataset.data || []).forEach((point) => {
                        rows.push([
                            escapeCsvValue(series),
                            escapeCsvValue(lastXLabel),
                            escapeCsvValue(point.x),
                            escapeCsvValue(lastYLabel),
                            escapeCsvValue(point.y)
                        ].join(','));
                    });
                });
            }

            if (lastElementDatasets.length) {
                if (rows.length > 0) rows.push('');
                const allMetrics = new Set();
                lastElementDatasets.forEach(d => d.metrics.forEach(m => allMetrics.add(m)));
                const columns = ELEMENT_DISPLAY_COLUMNS.filter(c => allMetrics.has(c.toLowerCase().trim()));
                rows.push(['Source', ...columns.map(escapeCsvValue)].join(','));
                lastElementDatasets.forEach(ds => {
                    ds.records.forEach(rec => {
                        const vals = [escapeCsvValue(ds.label)];
                        columns.forEach(col => vals.push(escapeCsvValue(rec[col.toLowerCase().trim()] ?? '')));
                        rows.push(vals.join(','));
                    });
                });
            }

            const csvContent = rows.join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');

            link.href = url;
            link.setAttribute('download', buildExportFileName());
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);

            log(`Export complete. Saved ${rows.filter(r => r).length - 1} rows to CSV.`, 'success');
        }

        exportCsvBtn.addEventListener('click', exportRenderedDataToCsv);

        const colorPalette = [
            '#2563eb', '#16a34a', '#ea580c', '#9333ea', '#db2777', 
            '#0284c7', '#ca8a04', '#dc2626', '#4f46e5', '#059669'
        ];

        analyzeBtn.addEventListener('click', () => {
            if (!dbInstance) {
                log("You must select a .db file first!", "error");
                return;
            }

            const searchTermsRaw = searchTermEl.value;
            const searchMatchers = compileSearchTerms(searchTermsRaw);
            const instrumentTerms = getSelectedInstrumentTerms();
            const instrumentFilterLabel = getSelectedInstrumentLabel();
            
            if (searchMatchers.length === 0) return;

            const xAxisChoice = X_AXIS_OPTIONS[xAxisSelectEl.value] || X_AXIS_OPTIONS.time_elapsed;
            const yAxisChoice = Y_AXIS_OPTIONS[yAxisSelectEl.value] || Y_AXIS_OPTIONS.flux;
            const xKeywords = xAxisChoice.keywords;
            const yKeywords = yAxisChoice.keywords;
            const excludeWords = parseKeywords(excludeWordsEl.value);

            document.getElementById('element-data-panel').classList.add('hidden');
            document.getElementById('element-table-container').innerHTML = '';

            log(`\n--- Starting analysis for: '${searchTermsRaw}' ---`);

            try {
                const tablesResult = dbInstance.exec("SELECT name FROM sqlite_master WHERE type='table';");
                if (tablesResult.length === 0) return;

                const allTables = tablesResult[0].values.map(row => row[0]);
                let foundTerms = new Set();
                let matchedTables = [];
                
                for (let tableName of allTables) {
                    if (isSummaryGraphTable(tableName)) continue;

                    const dataResult = dbInstance.exec(`SELECT * FROM "${tableName}"`);
                    if (dataResult.length === 0) continue;
                    
                    const values = dataResult[0].values;
                    let sheetSampleNames = [];
                    
                    for (let r = 0; r < values.length; r++) {
                        for (let c = 0; c < values[r].length; c++) {
                            if (String(values[r][c]).toLowerCase().includes('sample name')) {
                                for (let col = c + 1; col < values[r].length; col++) {
                                    let val = String(values[r][col]).trim();
                                    if (val && val !== 'null') sheetSampleNames.push(val);
                                }
                            }
                        }
                    }
                    
                    let searchTargets = sheetSampleNames.length > 0 ? sheetSampleNames.join(' | ') : tableName;
                    
                    let isSearchMatch = false;
                    searchMatchers.forEach(matcher => {
                        if (matcher.test(searchTargets)) {
                            isSearchMatch = true;
                            foundTerms.add(matcher.raw);
                        }
                    });

                    if (isSearchMatch) matchedTables.push(tableName);
                }

                searchMatchers.forEach(matcher => {
                    if (!foundTerms.has(matcher.raw)) log(`CRITICAL: Database contains 0 tables for '${matcher.raw}'.`, "error");
                });

                if (matchedTables.length === 0) {
                    let msg = `No data found for lot(s) '${searchTermsRaw}'`;
                    if (instrumentTerms.length > 0) msg += ` on instrument(s) '${instrumentFilterLabel}'`;
                    log(msg + ".", "error");
                    chartTitle.textContent = `No valid data found`;
                    if (chartInstance) chartInstance.destroy();
                    resetRenderedDataState();
                    return;
                }

                log(`Found ${matchedTables.length} tables matching Lot #. Deep scanning cells...`);

                let chartDatasets = [];
                let elementDatasets = [];
                let colorIndex = 0;

                for (let tableName of matchedTables) {
                    log(`Processing [${tableName.substring(0, 30)}...]`);
                    
                    const dataResult = dbInstance.exec(`SELECT * FROM "${tableName}"`);
                    if (dataResult.length === 0) continue;

                    const columns = dataResult[0].columns;
                    const values = dataResult[0].values; 

                    if (instrumentTerms.length > 0) {
                        let isInstMatch = false;
                        for (let c = 0; c < columns.length; c++) {
                            let colStr = String(columns[c]).toLowerCase();
                            if (instrumentTerms.some(inst => colStr.includes(inst))) { isInstMatch = true; break; }
                        }
                        if (!isInstMatch) {
                            for (let r = 0; r < values.length; r++) {
                                for (let c = 0; c < values[r].length; c++) {
                                    let cellStr = String(values[r][c]).toLowerCase();
                                    if (instrumentTerms.some(inst => cellStr.includes(inst))) { isInstMatch = true; break; }
                                }
                                if (isInstMatch) break;
                            }
                        }
                        if (!isInstMatch) {
                            log(`  -> SKIPPED: Requested instrument not found in sheet.`, "warn");
                            continue;
                        }
                    }

                    // Expand checked canonical labels to their full set of raw DB values.
                    // Each entry may also impose a 2nd-pass requirement (true | false | null=any).
                    const checkedFeedEntries = [];
                    document.querySelectorAll('.feed-checkbox:checked').forEach(cb => {
                        try {
                            const raws = new Set(JSON.parse(cb.dataset.raw || '[]'));
                            const rsp = cb.dataset.requireSecondPass;
                            const requireSecondPass = rsp === 'true' ? true : rsp === 'false' ? false : null;
                            checkedFeedEntries.push({ raws, requireSecondPass });
                        } catch(e) {}
                    });
                    if (checkedFeedEntries.length > 0) {
                        let tableFeedVals = [];
                        for (let r = 0; r < values.length; r++) {
                            for (let c = 0; c < values[r].length; c++) {
                                if (String(values[r][c]).toLowerCase().includes('feed solution')) {
                                    if (c + 1 < values[r].length) tableFeedVals.push(String(values[r][c+1]).trim());
                                }
                            }
                        }
                        const tableIs2ndPass = /(2nd[\s_]*pass|second[\s_]*pass)/i.test(tableName);
                        const hasMatch = checkedFeedEntries.some(entry =>
                            tableFeedVals.some(v => entry.raws.has(v)) &&
                            (entry.requireSecondPass === null || entry.requireSecondPass === tableIs2ndPass)
                        );
                        if (!hasMatch) {
                            log(`  -> SKIPPED: Feed Solution mismatch.`, "warn");
                            continue;
                        }
                    }

                    if (isElementPerformanceTable(tableName, values)) {
                        log(`  -> [Element Data] Detected Performance Calculation table.`);
                        const elemResult = extractElementData(values);
                        if (elemResult.records.length > 0) {
                            log(`  -> SUCCESS: Extracted ${elemResult.records.length} element measurement(s).`, "success");
                            elementDatasets.push({
                                tableName: tableName,
                                label: formatLegendLabel(tableName, false),
                                records: elemResult.records,
                                metrics: elemResult.metrics
                            });
                        } else {
                            log(`  -> SKIPPED: No valid element measurements found.`, "warn");
                        }
                        continue;
                    }

                    let xLoc = null;
                    let yLoc = null;

                    for(let c = 0; c < columns.length; c++) {
                        let colStr = String(columns[c]).toLowerCase();
                        if(!xLoc && xKeywords.some(kw => colStr.includes(kw)) && !excludeWords.some(bw => colStr.includes(bw))) xLoc = {r: -1, c: c};
                        if(!yLoc && yKeywords.some(kw => colStr.includes(kw)) && !excludeWords.some(bw => colStr.includes(bw))) yLoc = {r: -1, c: c};
                    }

                    for (let r = 0; r < values.length; r++) {
                        for (let c = 0; c < values[r].length; c++) {
                            let cellStr = String(values[r][c]).toLowerCase();
                            if (!xLoc && xKeywords.some(kw => cellStr.includes(kw)) && !excludeWords.some(bw => cellStr.includes(bw))) xLoc = {r: r, c: c};
                            if (!yLoc && yKeywords.some(kw => cellStr.includes(kw)) && !excludeWords.some(bw => cellStr.includes(bw))) yLoc = {r: r, c: c};
                        }
                    }

                    let dataPoints = [];

                    if (xLoc && yLoc) {
                        if (xLoc.r === yLoc.r) {
                            log(`  -> [Deep Scan: Vertical] X/Y found at Col ${xLoc.c}/${yLoc.c}`);
                            let startRow = Math.max(xLoc.r, yLoc.r) + 1;
                            for (let r = startRow; r < values.length; r++) {
                                let xNum = extractNumber(values[r][xLoc.c]);
                                let yNum = extractNumber(values[r][yLoc.c]);
                                if (xNum !== null && yNum !== null && xNum > -100 && xNum < 50000) dataPoints.push({x: xNum, y: yNum});
                            }
                        } else if (xLoc.c === yLoc.c && xLoc.r !== -1 && yLoc.r !== -1) {
                            log(`  -> [Deep Scan: Horizontal] X/Y found at Row ${xLoc.r}/${yLoc.r}`);
                            let startCol = Math.max(xLoc.c, yLoc.c) + 1;
                            for (let c = startCol; c < columns.length; c++) {
                                let xNum = extractNumber(values[xLoc.r][c]);
                                let yNum = extractNumber(values[yLoc.r][c]);
                                if (xNum !== null && yNum !== null && xNum > -100 && xNum < 50000) dataPoints.push({x: xNum, y: yNum});
                            }
                        } else {
                            log(`  -> SKIPPED: Headers found, but are diagonally misaligned.`, "warn");
                        }
                    } else {
                        log(`  -> SKIPPED: Missing X or Y headers in grid.`, "warn");
                    }

                    dataPoints.sort((a, b) => a.x - b.x);

                    if (dataPoints.length > 0) {
                        log(`  -> SUCCESS: Plotted ${dataPoints.length} valid coordinates.`, "success");
                        chartDatasets.push({
                            label: formatLegendLabel(tableName, true),
                            fullLabel: formatLegendLabel(tableName, false),
                            data: dataPoints,
                            borderColor: colorPalette[colorIndex % colorPalette.length],
                            backgroundColor: colorPalette[colorIndex % colorPalette.length],
                            tension: 0.1,
                            fill: false,
                            borderWidth: 2,
                            pointRadius: 4,
                            pointHoverRadius: 6
                        });
                        colorIndex++;
                    }
                }

                const displayTerms = searchTermsRaw.length > 40 ? searchTermsRaw.substring(0, 40) + '...' : searchTermsRaw;

                if (chartDatasets.length > 0) {
                    chartTitle.textContent = `Performance Metrics for ${displayTerms}`;
                    renderChart(chartDatasets, xAxisChoice.label, yAxisChoice.label);
                    lastRenderedDatasets = chartDatasets;
                    lastXLabel = xAxisChoice.label;
                    lastYLabel = yAxisChoice.label;
                    exportCsvBtn.disabled = false;
                    log(`\nAnalysis complete. Rendered ${chartDatasets.length} lines.`, "success");
                } else if (elementDatasets.length === 0) {
                    let msg = `No valid data found for lot(s) '${searchTermsRaw}'`;
                    if (instrumentTerms.length > 0) msg += ` on instrument(s) '${instrumentFilterLabel}'`;
                    log(msg + ".", "error");
                    chartTitle.textContent = `No valid data found`;
                    if (chartInstance) chartInstance.destroy();
                    resetRenderedDataState();
                }

                if (elementDatasets.length > 0) {
                    if (chartDatasets.length === 0) {
                        if (chartInstance) chartInstance.destroy();
                        document.getElementById('chart-container').style.display = 'none';
                    }
                    document.getElementById('element-title').textContent = `Element Performance for ${displayTerms}`;
                    renderElementData(elementDatasets);
                    lastElementDatasets = elementDatasets;
                    exportCsvBtn.disabled = false;
                    const totalRecords = elementDatasets.reduce((s, d) => s + d.records.length, 0);
                    log(`\nElement data: ${totalRecords} measurement(s) from ${elementDatasets.length} table(s).`, "success");
                } else {
                    document.getElementById('chart-container').style.display = '';
                }

            } catch (err) {
                log(`Database Error: ${err.message}`, "error");
                resetRenderedDataState();
            }
        });

        function renderChart(datasets, xLabel, yLabel) {
            const ctx = document.getElementById('mainChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            const cleanXLabel = xLabel.charAt(0).toUpperCase() + xLabel.slice(1);
            const cleanYLabel = yLabel.charAt(0).toUpperCase() + yLabel.slice(1);

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: { datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'nearest', intersect: false },
                    layout: { padding: { right: 0 } },
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: { 
                            backgroundColor: 'rgba(15, 23, 42, 0.95)', 
                            titleFont: { size: 12 }, 
                            bodyFont: { size: 11 }, 
                            padding: 12, 
                            displayColors: true,
                            callbacks: {
                                label: function(context) {
                                    let fullText = context.dataset.fullLabel || context.dataset.label;
                                    let yVal = context.parsed.y;
                                    
                                    let words = fullText.split(' ');
                                    let lines = [];
                                    let currentLine = '';
                                    for (let word of words) {
                                        if (currentLine.length + word.length > 55) {
                                            lines.push(currentLine.trim());
                                            currentLine = word + ' ';
                                        } else {
                                            currentLine += word + ' ';
                                        }
                                    }
                                    if (currentLine) lines.push(currentLine.trim());
                                    
                                    lines.push(`Value: ${yVal}`);
                                    return lines;
                                }
                            }
                        }
                    },
                    scales: {
                        x: { type: 'linear', title: { display: true, text: cleanXLabel + ' (Auto-Extracted)', font: { weight: 'bold', size: 14 } }, grid: { color: '#f1f5f9' } },
                        y: { title: { display: true, text: cleanYLabel + ' (Auto-Extracted)', font: { weight: 'bold', size: 14 } }, grid: { color: '#f1f5f9' } }
                    }
                }
            });

            buildHtmlLegend(datasets);
        }

        function buildHtmlLegend(datasets) {
            const legendContainer = document.getElementById('chart-legend');
            legendContainer.innerHTML = '';

            datasets.forEach((dataset) => {
                const row = document.createElement('div');
                row.className = 'flex items-start gap-2 text-[11px] text-slate-700 leading-snug py-0.5';

                const dot = document.createElement('span');
                dot.className = 'mt-1 h-2.5 w-2.5 rounded-full shrink-0';
                dot.style.backgroundColor = dataset.borderColor;

                const text = document.createElement('span');
                text.className = 'break-words';
                text.textContent = dataset.fullLabel || dataset.label;

                row.appendChild(dot);
                row.appendChild(text);
                legendContainer.appendChild(row);
            });
        }

        function renderElementData(datasets) {
            const panel = document.getElementById('element-data-panel');
            const container = document.getElementById('element-table-container');
            panel.classList.remove('hidden');

            const allMetrics = new Set();
            datasets.forEach(d => d.metrics.forEach(m => allMetrics.add(m)));
            const columns = ELEMENT_DISPLAY_COLUMNS.filter(c => allMetrics.has(c.toLowerCase().trim()));

            let html = '<table class="w-full text-sm border-collapse">';
            html += '<thead><tr class="bg-slate-100 border-b border-slate-300">';
            html += '<th class="px-3 py-2 text-left text-xs font-semibold text-slate-600 uppercase tracking-wide">Source</th>';
            columns.forEach(col => {
                html += `<th class="px-3 py-2 text-right text-xs font-semibold text-slate-600 uppercase tracking-wide whitespace-nowrap">${col}</th>`;
            });
            html += '</tr></thead><tbody>';

            datasets.forEach(ds => {
                ds.records.forEach(rec => {
                    html += '<tr class="border-b border-slate-200 hover:bg-slate-50">';
                    html += `<td class="px-3 py-2 text-xs text-slate-600 max-w-[200px] truncate" title="${ds.label}">${ds.label}</td>`;
                    columns.forEach(col => {
                        const key = col.toLowerCase().trim();
                        const val = rec[key];
                        let display = val ?? '—';
                        if (val && key !== 'serial #' && key !== 'cell #' && key !== 'date tested') {
                            const num = parseFloat(val);
                            if (!isNaN(num)) {
                                if (num !== 0 && Math.abs(num) < 0.01) display = num.toExponential(2);
                                else display = num % 1 === 0 ? num.toString() : num.toFixed(2);
                            }
                        }
                        html += `<td class="px-3 py-2 text-right text-sm text-slate-800 tabular-nums whitespace-nowrap">${display}</td>`;
                    });
                    html += '</tr>';
                });
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        instrumentDropdownBtn.addEventListener('click', () => instrumentDropdownPanel.classList.toggle('hidden'));
        document.addEventListener('click', (e) => {
            if (!instrumentDropdownBtn.contains(e.target) && !instrumentDropdownPanel.contains(e.target)) {
                instrumentDropdownPanel.classList.add('hidden');
            }
        });

        instrumentList.addEventListener('change', (e) => {
            const target = e.target;
            if (!target.classList.contains('instrument-checkbox')) return;

            if (target.value === 'none' && target.checked) {
                instrumentList.querySelectorAll('.instrument-checkbox').forEach(cb => {
                    if (cb.value !== 'none') cb.checked = false;
                });
            } else if (target.value !== 'none' && target.checked) {
                const noneCheckbox = instrumentList.querySelector('.instrument-checkbox[value="none"]');
                if (noneCheckbox) noneCheckbox.checked = false;
            }

            const checked = instrumentList.querySelectorAll('.instrument-checkbox:checked');
            if (checked.length === 0) {
                const noneCheckbox = instrumentList.querySelector('.instrument-checkbox[value="none"]');
                if (noneCheckbox) noneCheckbox.checked = true;
            }

            syncInstrumentButtonText();
        });

        syncInstrumentButtonText();

        const feedBtn = document.getElementById('feed-dropdown-btn');
        const feedPanel = document.getElementById('feed-dropdown-panel');
        const feedSearch = document.getElementById('feed-search');
        const feedBtnText = document.getElementById('feed-btn-text');
        const feedClearBtn = document.getElementById('feed-clear-btn');

        feedBtn.addEventListener('click', () => feedPanel.classList.toggle('hidden'));
        document.addEventListener('click', (e) => {
            if (!feedBtn.contains(e.target) && !feedPanel.contains(e.target)) feedPanel.classList.add('hidden');
        });

        feedSearch.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('.feed-item').forEach(item => {
                const labelText = item.querySelector('label').innerText.toLowerCase();
                item.style.display = labelText.includes(term) ? 'flex' : 'none';
            });
        });

        // Update button text AND persist checked canonicals so re-renders can restore them
        let lastCheckedCanonicals = new Set();
        document.getElementById('feed-list').addEventListener('change', () => {
            const checked = Array.from(document.querySelectorAll('.feed-checkbox:checked'));
            lastCheckedCanonicals = new Set(checked.map(cb => cb.value));
            const checkedCount = checked.length;
            if (checkedCount === 0) {
                const terms = parseKeywords(searchTermEl.value);
                feedBtnText.innerText = terms.length > 0
                    ? `All Matching Solutions (${document.querySelectorAll('.feed-checkbox').length})`
                    : 'All Solutions (No Filter)';
            } else if (checkedCount === 1) feedBtnText.innerText = '1 Solution Selected';
            else feedBtnText.innerText = `${checkedCount} Solutions Selected`;
        });

        // --- UPGRADED: Clear All Selections Logic ---
        feedClearBtn.addEventListener('click', (e) => {
            e.preventDefault(); 
            document.querySelectorAll('.feed-checkbox').forEach(cb => cb.checked = false);
            feedSearch.value = '';
            document.querySelectorAll('.feed-item').forEach(item => item.style.display = 'flex');
            document.getElementById('feed-list').dispatchEvent(new Event('change'));
        });

        function normalizeFeedSolution(raw) {
            // Hard overrides for entries that cannot be fixed by pattern matching alone
            const hardOverrides = {
                '2000': '2,000 ppm NaCl',
                '2001 PPm NaCl': '2,000 ppm NaCl',
                '1100': '1,100 ppm NaCl',
                '1130': '1,130 ppm NaCl',
                '550':  '550 ppm NaCl',
                '870':  '870 ppm NaCl',
            };
            const trimmed = raw.trim();
            if (hardOverrides[trimmed] !== undefined) return hardOverrides[trimmed];

            // ASTM Sea Water detection — must run against the raw string before other transforms
            // Matches any multi-salt seawater mix: NaCl + MgCl₂ + (KBr or NaHCO₃), or NaCl + MgCl + MgSO4 variants
            {
                const lc = trimmed.toLowerCase();
                const isASTM = (lc.includes('mgcl') && (lc.includes('kbr') || lc.includes('nahco'))) ||
                               (lc.includes('mgcl') && lc.includes('mgso') && lc.includes('kcl'));
                if (isASTM) {
                    const hasNaOCl  = lc.includes('naocl');
                    const hasCitric = lc.includes('citric');
                    if (hasNaOCl && hasCitric) return 'ASTM Sea Water + 10 ppm NaOCl + citric acid';
                    if (hasNaOCl)              return 'ASTM Sea Water + 10 ppm NaOCl';
                    if (hasCitric)             return 'ASTM Sea Water + citric acid';
                    return 'ASTM Sea Water';
                }
            }

            let s = trimmed;

            // K notation: 2K / 2k / 32k → plain number (2000, 32000)
            s = s.replace(/\b(\d+(?:\.\d+)?)\s*[Kk]\b/g, (_, n) => String(parseFloat(n) * 1000));

            // Remove commas inside numbers so we can re-add them uniformly (2,000 → 2000)
            s = s.replace(/(\d),(\d)/g, '$1$2');

            // Normalize ppm case variations (PPM, PPm, Ppm → ppm)
            s = s.replace(/\b[Pp][Pp][Mm]\b/g, 'ppm');

            // Add space between digit and ppm: 2000ppm → 2000 ppm
            s = s.replace(/(\d)(ppm)/gi, '$1 ppm');

            // Add "ppm" when a bare number is immediately followed by a chemical name (missing unit)
            // e.g. "2000 NaCl" → "2000 ppm NaCl"  (won't fire when ppm is already present)
            s = s.replace(/\b(\d+(?:\.\d+)?)\s+(NaCl|NaCL|NACL|Nacl|NaCI)\b/g, '$1 ppm $2');

            // Normalize NaCl case variations → NaCl (including NaCI with capital I)
            s = s.replace(/\bNa[Cc][Ll]\b/g, 'NaCl');  // NaCl, NaCL, Nacl, NacL
            s = s.replace(/\bNACL\b/gi, 'NaCl');        // NACL
            s = s.replace(/\bNaCI\b/g, 'NaCl');         // NaCI (capital I mistaken for l)

            // Add commas to integers ≥ 1000 (2000 → 2,000, 32000 → 32,000)
            s = s.replace(/\b(\d{4,})\b/g, (m) => parseInt(m, 10).toLocaleString('en-US'));

            // Normalize spacing around +
            s = s.replace(/\s*\+\s*/g, ' + ');

            // Collapse multiple spaces
            s = s.replace(/  +/g, ' ');

            return s.trim();
        }

        // Per-table metadata cache — built once per DB load, reused by renderFeedDropdown
        let tableMetaCache = [];

        // Reject values that are obviously column headers / measurement labels rather than
        // actual feed-solution chemistries. These leak in when "Feed Solution" appears as a
        // header in a row of column headers and the scanner picks up the adjacent header cell.
        const FEED_HEADER_BLOCKLIST = /^(pressure|temperature|temp|flow(?:\s*rate)?|conductivity|ph|turbidity|time(?:\s*elapsed)?|elapsed|date|sample(?:\s*name)?|sample\s*id|flux|recovery|permeate|feed|concentrate|reject|tmp|run\s*time|cell|membrane|instrument|operator|notes?|comments?|stage|cycle|step|salt\s*passage|rejection|tds)\b/i;

        function isLikelyHeaderLabel(val) {
            const v = String(val).trim();
            if (!v) return true;
            // Excel error sentinels (#REF!, #N/A, #VALUE!, #DIV/0!, #NAME?, #NULL!, #NUM!)
            if (/^#(REF|N\/A|VALUE|DIV\/0|NAME|NULL|NUM)[!?]?$/i.test(v)) return true;
            // Pure unit-bracketed labels like "Pressure (PSI)", "Temperature (°C)", "Flow (mL/min)"
            if (FEED_HEADER_BLOCKLIST.test(v)) return true;
            // A bare unit-in-parens with no chemistry indicator
            if (/^[A-Za-z][A-Za-z\s/]*\s*\([^)]*\)\s*$/.test(v) && !/(ppm|nacl|cacl|mgcl|na2so4|naocl|citric|h2o2|caco3|silica|hcl|naoh|kbr|nahco|kcl|mgso)/i.test(v)) {
                return true;
            }
            return false;
        }

        function populateFeedSolutions() {
            log("Scanning database to extract unique Feed Solutions...");
            const tablesResult = dbInstance.exec("SELECT name FROM sqlite_master WHERE type='table';");
            if (tablesResult.length === 0) return;

            const allTables = tablesResult[0].values.map(row => row[0]);
            tableMetaCache = [];

            for (let tableName of allTables) {
                const dataResult = dbInstance.exec(`SELECT * FROM "${tableName}"`);
                if (dataResult.length === 0) continue;
                const values = dataResult[0].values;

                let sheetSampleNames = [];
                let feedRaws = [];
                for (let r = 0; r < values.length; r++) {
                    for (let c = 0; c < values[r].length; c++) {
                        const cellLc = String(values[r][c]).toLowerCase();
                        if (cellLc.includes('sample name')) {
                            for (let col = c + 1; col < values[r].length; col++) {
                                const val = String(values[r][col]).trim();
                                if (val && val !== 'null') sheetSampleNames.push(val);
                            }
                        }
                        if (cellLc.includes('feed solution') && c + 1 < values[r].length) {
                            const val = String(values[r][c + 1]).trim();
                            if (val && val !== 'null' && !isLikelyHeaderLabel(val)) feedRaws.push(val);
                        }
                    }
                }

                tableMetaCache.push({
                    tableName,
                    searchHaystack: sheetSampleNames.length > 0 ? sheetSampleNames.join(' | ') : tableName,
                    feedRaws,
                    is2ndPass: /(2nd[\s_]*pass|second[\s_]*pass)/i.test(tableName)
                });
            }

            const totalRaw = tableMetaCache.reduce((s, m) => s + m.feedRaws.length, 0);
            log(`Background scan complete. Cached ${tableMetaCache.length} tables (${totalRaw} raw feed entries). Rendering dropdown...`, "success");
            renderFeedDropdown();
        }

        function renderFeedDropdown() {
            if (!tableMetaCache.length) return;

            const searchMatchers = compileSearchTerms(searchTermEl.value);

            // Filter cache to tables that match the current search terms (shared matcher logic with Analyze flow)
            let allowedTables;
            if (searchMatchers.length === 0) {
                allowedTables = tableMetaCache;
            } else {
                allowedTables = tableMetaCache.filter(meta =>
                    searchMatchers.some(matcher => matcher.test(meta.searchHaystack))
                );
            }

            // canonicalMap: canonical label -> { raws: Set<string>, requireSecondPass: bool|null }
            // ASTM Sea Water entries are split into a base bucket and a "- 2nd pass" bucket
            // based on the source table's title.
            const canonicalMap = new Map();
            allowedTables.forEach(meta => {
                meta.feedRaws.forEach(raw => {
                    let canonical = normalizeFeedSolution(raw);
                    let requireSecondPass = null;
                    if (canonical.startsWith('ASTM Sea Water')) {
                        if (meta.is2ndPass) {
                            canonical = canonical + ' - 2nd pass';
                            requireSecondPass = true;
                        } else {
                            requireSecondPass = false;
                        }
                    }
                    if (!canonicalMap.has(canonical)) {
                        canonicalMap.set(canonical, { raws: new Set(), requireSecondPass });
                    }
                    canonicalMap.get(canonical).raws.add(raw);
                });
            });

            const sortedCanonical = Array.from(canonicalMap.keys()).sort();
            const feedList = document.getElementById('feed-list');
            feedList.innerHTML = '';

            if (sortedCanonical.length === 0) {
                const msg = searchMatchers.length > 0
                    ? 'No feed solutions for the current Search Terms.'
                    : 'No feed solutions found in DB.';
                feedList.innerHTML = `<div class="text-sm text-slate-500 italic px-2">${msg}</div>`;
                feedBtnText.innerText = searchMatchers.length > 0 ? 'No Matching Solutions' : 'No Solutions Found';
                return;
            }

            sortedCanonical.forEach(canonical => {
                const entry = canonicalMap.get(canonical);
                const rawVals = Array.from(entry.raws);
                const div = document.createElement('div');
                div.className = 'flex items-center px-2 py-1 hover:bg-slate-100 rounded cursor-pointer feed-item';

                const input = document.createElement('input');
                input.type = 'checkbox';
                input.value = canonical;
                input.dataset.raw = JSON.stringify(rawVals);
                input.dataset.requireSecondPass = entry.requireSecondPass === null ? '' : String(entry.requireSecondPass);
                input.className = 'feed-checkbox h-4 w-4 text-blue-600 focus:ring-blue-500 border-slate-300 rounded mr-2 cursor-pointer';
                if (lastCheckedCanonicals.has(canonical)) input.checked = true;

                const label = document.createElement('label');
                label.className = 'text-xs text-slate-700 truncate w-full cursor-pointer';
                label.title = rawVals.length > 1
                    ? `${canonical}\n(${rawVals.length} variants merged)`
                    : canonical;
                label.textContent = canonical;

                div.appendChild(input);
                div.appendChild(label);
                div.addEventListener('click', (e) => {
                    if (e.target.tagName !== 'INPUT') {
                        input.checked = !input.checked;
                        input.dispatchEvent(new Event('change', { bubbles: true }));
                    }
                });
                feedList.appendChild(div);
            });

            // Fire change to sync button text without altering lastCheckedCanonicals mid-render
            feedList.dispatchEvent(new Event('change'));
        }

        // Debounced re-render of feed dropdown when Search Terms change
        let searchTermDebounce = null;
        searchTermEl.addEventListener('input', () => {
            clearTimeout(searchTermDebounce);
            searchTermDebounce = setTimeout(renderFeedDropdown, 200);
        });
    </script>
</body>
