<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NALA R&D Data Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        .log-window::-webkit-scrollbar { width: 8px; }
        .log-window::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .log-window::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .log-window::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .chart-legend::-webkit-scrollbar { width: 8px; }
        .chart-legend::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .chart-legend::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .chart-legend::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans h-screen flex overflow-hidden">

    <div class="w-96 bg-white border-r border-slate-200 shadow-sm flex flex-col h-full z-10">
        <div class="p-6 border-b border-slate-100 flex items-center space-x-3 bg-blue-50">
            <i data-lucide="flask-conical" class="text-blue-600"></i>
            <h1 class="text-xl font-bold text-slate-800">NALA Explorer</h1>
        </div>

        <div class="p-6 overflow-y-auto flex-1 space-y-6">
            
            <div class="space-y-2">
                <label class="block text-sm font-semibold text-slate-700">1. Load Database</label>
                <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-slate-300 border-dashed rounded-lg hover:border-blue-500 transition-colors bg-slate-50 relative">
                    <div class="space-y-1 text-center">
                        <i data-lucide="database" class="mx-auto h-8 w-8 text-slate-400"></i>
                        <div class="flex text-sm text-slate-600 mt-2">
                            <label for="db-file" class="relative cursor-pointer bg-white rounded-md font-medium text-blue-600 hover:text-blue-500 focus-within:outline-none focus-within:ring-2 px-2 py-1 shadow-sm border border-slate-200">
                                <span>Select .db file</span>
                                <input id="db-file" name="db-file" type="file" class="sr-only" accept=".db,.sqlite">
                            </label>
                        </div>
                        <p id="file-name-display" class="text-xs text-slate-500 mt-2">nala_rd_data.db</p>
                    </div>
                </div>
            </div>

            <div class="space-y-4">
                <label class="block text-sm font-semibold text-slate-700 border-b pb-2">2. Search Parameters</label>
                
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">Search Terms (Comma separated)</label>
                    <input type="text" id="search-term" value="7GR1, 7GR25" class="w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">Instrument Filter (Optional)</label>
                    <input type="text" id="instrument-filter" placeholder="e.g., Nammu, Neptune, Poseidon" class="w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm text-slate-700">
                </div>

                <div class="relative z-20">
                    <label class="block text-xs font-medium text-slate-500 mb-1">Feed Solution Filter (Multi-Select)</label>
                    <button id="feed-dropdown-btn" class="w-full text-left px-3 py-2 border border-slate-300 rounded-md shadow-sm bg-white focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm text-slate-700 flex justify-between items-center">
                        <span id="feed-btn-text" class="truncate pr-2">Load DB to populate...</span>
                        <i data-lucide="chevron-down" class="h-4 w-4 text-slate-400 shrink-0"></i>
                    </button>
                    <div id="feed-dropdown-panel" class="hidden absolute left-0 right-0 mt-1 bg-white border border-slate-300 rounded-md shadow-lg max-h-60 flex flex-col">
                        <div class="p-2 border-b border-slate-200 flex space-x-2">
                            <input type="text" id="feed-search" placeholder="Search..." class="flex-1 px-2 py-1 text-sm border border-slate-300 rounded-md focus:outline-none focus:border-blue-500">
                            <button id="feed-clear-btn" class="px-3 py-1 text-xs font-medium text-slate-600 bg-slate-100 border border-slate-300 rounded-md hover:bg-slate-200 transition-colors shadow-sm focus:outline-none">Clear</button>
                        </div>
                        <div id="feed-list" class="overflow-y-auto p-2 space-y-1 flex-1 bg-slate-50">
                            <div class="text-xs text-slate-500 italic px-2 py-1">Please select a .db file first.</div>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">X-Axis Keywords (Comma separated, priority order)</label>
                    <textarea id="x-keywords" rows="2" class="w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm text-slate-700">time elapsed, elapsed, run time, time (h), time (hrs), time</textarea>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">Y-Axis Keywords (Comma separated)</label>
                    <input type="text" id="y-keywords" value="flux" class="w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm text-slate-700">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">Exclude/Poison Words (Ignore rows with these)</label>
                    <input type="text" id="exclude-words" value="date, install, prep, system, clock" class="w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm text-slate-700">
                </div>
            </div>
        </div>

        <div class="p-6 border-t border-slate-200 bg-slate-50">
            <button id="analyze-btn" class="w-full flex justify-center items-center py-2.5 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                <i data-lucide="line-chart" class="mr-2 h-4 w-4"></i>
                Analyze & Plot
            </button>
        </div>
    </div>

    <div class="flex-1 flex flex-col h-full bg-slate-100 p-6 overflow-hidden">
        
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex-1 flex flex-col mb-6 relative">
            <h2 id="chart-title" class="text-lg font-bold text-slate-800 mb-4 text-center">Awaiting Data...</h2>
            <div class="w-full flex-1 min-h-[300px] flex gap-4 overflow-hidden">
                <div class="relative flex-1 min-w-0">
                    <canvas id="mainChart"></canvas>
                </div>
                <div class="w-[320px] max-w-[35%] min-w-[260px] border border-slate-200 rounded-lg bg-slate-50 p-3 flex flex-col">
                    <h3 class="text-xs font-semibold text-slate-600 uppercase tracking-wide mb-2">Experiment Source</h3>
                    <div id="chart-legend" class="chart-legend flex-1 overflow-y-auto space-y-1 pr-1"></div>
                </div>
            </div>
        </div>

        <div class="bg-slate-900 rounded-xl shadow-lg border border-slate-700 h-64 flex flex-col font-mono text-sm overflow-hidden shrink-0">
            <div class="bg-slate-800 px-4 py-2 border-b border-slate-700 flex justify-between items-center">
                <div class="flex items-center text-slate-300">
                    <i data-lucide="terminal" class="mr-2 h-4 w-4"></i>
                    Extraction Logs
                </div>
                <button id="clear-log-btn" class="text-xs text-slate-400 hover:text-white transition-colors">Clear</button>
            </div>
            <div id="log-window" class="p-4 overflow-y-auto log-window text-slate-300 space-y-1 flex-1">
                <p class="text-blue-400">> System Ready.</p>
                <p>> Please load your nala_rd_data.db file and click Analyze.</p>
            </div>
        </div>

    </div>

    <script>
        lucide.createIcons();

        let sqlPromise = null;
        let dbInstance = null;
        let chartInstance = null;

        const fileInput = document.getElementById('db-file');
        const fileNameDisplay = document.getElementById('file-name-display');
        const analyzeBtn = document.getElementById('analyze-btn');
        const logWindow = document.getElementById('log-window');
        const chartTitle = document.getElementById('chart-title');
        
        const searchTermEl = document.getElementById('search-term');
        const instrumentFilterEl = document.getElementById('instrument-filter');
        const xKeywordsEl = document.getElementById('x-keywords');
        const yKeywordsEl = document.getElementById('y-keywords');
        const excludeWordsEl = document.getElementById('exclude-words');

        function log(message, type = 'info') {
            const p = document.createElement('p');
            if (type === 'error') p.className = 'text-red-400';
            else if (type === 'success') p.className = 'text-green-400';
            else if (type === 'warn') p.className = 'text-yellow-400';
            else p.className = 'text-slate-300';
            
            p.textContent = `> ${message}`;
            logWindow.appendChild(p);
            logWindow.scrollTop = logWindow.scrollHeight;
        }

        document.getElementById('clear-log-btn').addEventListener('click', () => {
            logWindow.innerHTML = '<p class="text-blue-400">> Logs cleared.</p>';
        });

        log("Downloading SQL engine (WebAssembly)...");
        const config = {
            locateFile: filename => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${filename}`
        };
        
        initSqlJs(config).then(function(SQL){
            sqlPromise = SQL;
            log("SQL engine loaded successfully.", "success");
        }).catch(err => {
            log(`Failed to load SQL engine: ${err.message}`, "error");
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            fileNameDisplay.textContent = file.name;
            log(`Selected file: ${file.name}`);
            
            if (!sqlPromise) {
                log("SQL engine is still loading. Please wait...", "warn");
                return;
            }

            const reader = new FileReader();
            reader.onload = function() {
                try {
                    const Uints = new Uint8Array(reader.result);
                    if (dbInstance) dbInstance.close();
                    dbInstance = new sqlPromise.Database(Uints);
                    log(`Database '${file.name}' loaded into memory successfully!`, "success");
                    populateFeedSolutions(); 
                } catch (error) {
                    log(`Error loading database: ${error.message}`, "error");
                }
            };
            reader.readAsArrayBuffer(file);
        });

        function parseKeywords(rawString) {
            return rawString.split(',').map(s => s.trim().toLowerCase()).filter(s => s.length > 0);
        }

        function extractNumber(val) {
            if (val === null || val === undefined || val === '') return null;
            const strVal = String(val).replace(/,/g, '');
            const match = strVal.match(/([-+]?\d*\.?\d+(?:[eE][-+]?\d+)?)/);
            if (match) return parseFloat(match[1]);
            return null;
        }

        function formatLegendLabel(rawName, truncate = true) {
            let cleanName = rawName.replace('tbl_', '');
            cleanName = cleanName.replace(/^_+/, '');
            cleanName = cleanName.replace(/_/g, ' ');
            if (truncate) return cleanName.length > 45 ? cleanName.substring(0, 45) + '...' : cleanName;
            return cleanName;
        }

        const colorPalette = [
            '#2563eb', '#16a34a', '#ea580c', '#9333ea', '#db2777', 
            '#0284c7', '#ca8a04', '#dc2626', '#4f46e5', '#059669'
        ];

        analyzeBtn.addEventListener('click', () => {
            if (!dbInstance) {
                log("You must select a .db file first!", "error");
                return;
            }

            const searchTermsRaw = searchTermEl.value;
            const searchTerms = parseKeywords(searchTermsRaw);
            const instrumentTerms = parseKeywords(instrumentFilterEl.value);
            
            if (searchTerms.length === 0) return;

            const xKeywords = parseKeywords(xKeywordsEl.value);
            const yKeywords = parseKeywords(yKeywordsEl.value);
            const excludeWords = parseKeywords(excludeWordsEl.value);

            log(`\n--- Starting analysis for: '${searchTermsRaw}' ---`);

            try {
                const tablesResult = dbInstance.exec("SELECT name FROM sqlite_master WHERE type='table';");
                if (tablesResult.length === 0) return;

                const allTables = tablesResult[0].values.map(row => row[0]);
                let foundTerms = new Set();
                let matchedTables = [];
                
                for (let tableName of allTables) {
                    const dataResult = dbInstance.exec(`SELECT * FROM "${tableName}"`);
                    if (dataResult.length === 0) continue;
                    
                    const values = dataResult[0].values;
                    let sheetSampleNames = [];
                    
                    for (let r = 0; r < values.length; r++) {
                        for (let c = 0; c < values[r].length; c++) {
                            if (String(values[r][c]).toLowerCase().includes('sample name')) {
                                for (let col = c + 1; col < values[r].length; col++) {
                                    let val = String(values[r][col]).trim();
                                    if (val && val !== 'null') sheetSampleNames.push(val);
                                }
                            }
                        }
                    }
                    
                    let searchTargets = sheetSampleNames.length > 0 ? sheetSampleNames.join(' | ') : tableName;
                    
                    let isSearchMatch = false;
                    searchTerms.forEach(term => {
                        const safeTerm = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                        const exactMatchRegex = new RegExp(`(^|[^a-z0-9])${safeTerm}([^a-z0-9]|$)`, 'i');
                        
                        if (exactMatchRegex.test(searchTargets)) {
                            isSearchMatch = true;
                            foundTerms.add(term);
                        }
                    });

                    if (isSearchMatch) matchedTables.push(tableName);
                }

                searchTerms.forEach(term => {
                    if (!foundTerms.has(term)) log(`CRITICAL: Database contains 0 tables for '${term}'.`, "error");
                });

                if (matchedTables.length === 0) {
                    let msg = `No data found for lot(s) '${searchTermsRaw}'`;
                    if (instrumentTerms.length > 0) msg += ` on instrument(s) '${instrumentFilterEl.value}'`;
                    log(msg + ".", "error");
                    chartTitle.textContent = `No valid data found`;
                    if (chartInstance) chartInstance.destroy();
                    return;
                }

                log(`Found ${matchedTables.length} tables matching Lot #. Deep scanning cells...`);

                let chartDatasets = [];
                let colorIndex = 0;

                for (let tableName of matchedTables) {
                    log(`Processing [${tableName.substring(0, 30)}...]`);
                    
                    const dataResult = dbInstance.exec(`SELECT * FROM "${tableName}"`);
                    if (dataResult.length === 0) continue;

                    const columns = dataResult[0].columns;
                    const values = dataResult[0].values; 

                    if (instrumentTerms.length > 0) {
                        let isInstMatch = false;
                        for (let c = 0; c < columns.length; c++) {
                            let colStr = String(columns[c]).toLowerCase();
                            if (instrumentTerms.some(inst => colStr.includes(inst))) { isInstMatch = true; break; }
                        }
                        if (!isInstMatch) {
                            for (let r = 0; r < values.length; r++) {
                                for (let c = 0; c < values[r].length; c++) {
                                    let cellStr = String(values[r][c]).toLowerCase();
                                    if (instrumentTerms.some(inst => cellStr.includes(inst))) { isInstMatch = true; break; }
                                }
                                if (isInstMatch) break;
                            }
                        }
                        if (!isInstMatch) {
                            log(`  -> SKIPPED: Requested instrument not found in sheet.`, "warn");
                            continue;
                        }
                    }

                    const checkedFeeds = Array.from(document.querySelectorAll('.feed-checkbox:checked')).map(cb => cb.value);
                    if (checkedFeeds.length > 0) {
                        let tableFeedVals = [];
                        for (let r = 0; r < values.length; r++) {
                            for (let c = 0; c < values[r].length; c++) {
                                if (String(values[r][c]).toLowerCase().includes('feed solution')) {
                                    if (c + 1 < values[r].length) tableFeedVals.push(String(values[r][c+1]).trim());
                                }
                            }
                        }
                        let hasMatch = tableFeedVals.some(val => checkedFeeds.includes(val));
                        if (!hasMatch) {
                            log(`  -> SKIPPED: Feed Solution mismatch.`, "warn");
                            continue;
                        }
                    }

                    let xLoc = null;
                    let yLoc = null;

                    for(let c = 0; c < columns.length; c++) {
                        let colStr = String(columns[c]).toLowerCase();
                        if(!xLoc && xKeywords.some(kw => colStr.includes(kw)) && !excludeWords.some(bw => colStr.includes(bw))) xLoc = {r: -1, c: c};
                        if(!yLoc && yKeywords.some(kw => colStr.includes(kw)) && !excludeWords.some(bw => colStr.includes(bw))) yLoc = {r: -1, c: c};
                    }

                    for (let r = 0; r < values.length; r++) {
                        for (let c = 0; c < values[r].length; c++) {
                            let cellStr = String(values[r][c]).toLowerCase();
                            if (!xLoc && xKeywords.some(kw => cellStr.includes(kw)) && !excludeWords.some(bw => cellStr.includes(bw))) xLoc = {r: r, c: c};
                            if (!yLoc && yKeywords.some(kw => cellStr.includes(kw)) && !excludeWords.some(bw => cellStr.includes(bw))) yLoc = {r: r, c: c};
                        }
                    }

                    let dataPoints = [];

                    if (xLoc && yLoc) {
                        if (xLoc.r === yLoc.r) {
                            log(`  -> [Deep Scan: Vertical] X/Y found at Col ${xLoc.c}/${yLoc.c}`);
                            let startRow = Math.max(xLoc.r, yLoc.r) + 1;
                            for (let r = startRow; r < values.length; r++) {
                                let xNum = extractNumber(values[r][xLoc.c]);
                                let yNum = extractNumber(values[r][yLoc.c]);
                                if (xNum !== null && yNum !== null && xNum > -100 && xNum < 50000) dataPoints.push({x: xNum, y: yNum});
                            }
                        } else if (xLoc.c === yLoc.c && xLoc.r !== -1 && yLoc.r !== -1) {
                            log(`  -> [Deep Scan: Horizontal] X/Y found at Row ${xLoc.r}/${yLoc.r}`);
                            let startCol = Math.max(xLoc.c, yLoc.c) + 1;
                            for (let c = startCol; c < columns.length; c++) {
                                let xNum = extractNumber(values[xLoc.r][c]);
                                let yNum = extractNumber(values[yLoc.r][c]);
                                if (xNum !== null && yNum !== null && xNum > -100 && xNum < 50000) dataPoints.push({x: xNum, y: yNum});
                            }
                        } else {
                            log(`  -> SKIPPED: Headers found, but are diagonally misaligned.`, "warn");
                        }
                    } else {
                        log(`  -> SKIPPED: Missing X or Y headers in grid.`, "warn");
                    }

                    dataPoints.sort((a, b) => a.x - b.x);

                    if (dataPoints.length > 0) {
                        log(`  -> SUCCESS: Plotted ${dataPoints.length} valid coordinates.`, "success");
                        chartDatasets.push({
                            label: formatLegendLabel(tableName, true),
                            fullLabel: formatLegendLabel(tableName, false),
                            data: dataPoints,
                            borderColor: colorPalette[colorIndex % colorPalette.length],
                            backgroundColor: colorPalette[colorIndex % colorPalette.length],
                            tension: 0.1,
                            fill: false,
                            borderWidth: 2,
                            pointRadius: 4,
                            pointHoverRadius: 6
                        });
                        colorIndex++;
                    }
                }

                if (chartDatasets.length > 0) {
                    const displayTerms = searchTermsRaw.length > 40 ? searchTermsRaw.substring(0, 40) + '...' : searchTermsRaw;
                    chartTitle.textContent = `Performance Metrics for ${displayTerms}`;
                    renderChart(chartDatasets, xKeywords[0], yKeywords[0]);
                    log(`\nAnalysis complete. Rendered ${chartDatasets.length} lines.`, "success");
                } else {
                    let msg = `No valid data found for lot(s) '${searchTermsRaw}'`;
                    if (instrumentTerms.length > 0) msg += ` on instrument(s) '${instrumentFilterEl.value}'`;
                    log(msg + ".", "error");
                    chartTitle.textContent = `No valid data found`;
                    if (chartInstance) chartInstance.destroy();
                }

            } catch (err) {
                log(`Database Error: ${err.message}`, "error");
            }
        });

        function renderChart(datasets, xLabel, yLabel) {
            const ctx = document.getElementById('mainChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            const cleanXLabel = xLabel.charAt(0).toUpperCase() + xLabel.slice(1);
            const cleanYLabel = yLabel.charAt(0).toUpperCase() + yLabel.slice(1);

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: { datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'nearest', intersect: false },
                    layout: { padding: { right: 0 } },
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: { 
                            backgroundColor: 'rgba(15, 23, 42, 0.95)', 
                            titleFont: { size: 12 }, 
                            bodyFont: { size: 11 }, 
                            padding: 12, 
                            displayColors: true,
                            callbacks: {
                                label: function(context) {
                                    let fullText = context.dataset.fullLabel || context.dataset.label;
                                    let yVal = context.parsed.y;
                                    
                                    let words = fullText.split(' ');
                                    let lines = [];
                                    let currentLine = '';
                                    for (let word of words) {
                                        if (currentLine.length + word.length > 55) {
                                            lines.push(currentLine.trim());
                                            currentLine = word + ' ';
                                        } else {
                                            currentLine += word + ' ';
                                        }
                                    }
                                    if (currentLine) lines.push(currentLine.trim());
                                    
                                    lines.push(`Value: ${yVal}`);
                                    return lines;
                                }
                            }
                        }
                    },
                    scales: {
                        x: { type: 'linear', title: { display: true, text: cleanXLabel + ' (Auto-Extracted)', font: { weight: 'bold', size: 14 } }, grid: { color: '#f1f5f9' } },
                        y: { title: { display: true, text: cleanYLabel + ' (Auto-Extracted)', font: { weight: 'bold', size: 14 } }, grid: { color: '#f1f5f9' } }
                    }
                }
            });

            buildHtmlLegend(datasets);
        }

        function buildHtmlLegend(datasets) {
            const legendContainer = document.getElementById('chart-legend');
            legendContainer.innerHTML = '';

            datasets.forEach((dataset) => {
                const row = document.createElement('div');
                row.className = 'flex items-start gap-2 text-[11px] text-slate-700 leading-snug py-0.5';

                const dot = document.createElement('span');
                dot.className = 'mt-1 h-2.5 w-2.5 rounded-full shrink-0';
                dot.style.backgroundColor = dataset.borderColor;

                const text = document.createElement('span');
                text.className = 'break-words';
                text.textContent = dataset.fullLabel || dataset.label;

                row.appendChild(dot);
                row.appendChild(text);
                legendContainer.appendChild(row);
            });
        }

        const feedBtn = document.getElementById('feed-dropdown-btn');
        const feedPanel = document.getElementById('feed-dropdown-panel');
        const feedSearch = document.getElementById('feed-search');
        const feedBtnText = document.getElementById('feed-btn-text');
        const feedClearBtn = document.getElementById('feed-clear-btn');

        feedBtn.addEventListener('click', () => feedPanel.classList.toggle('hidden'));
        document.addEventListener('click', (e) => {
            if (!feedBtn.contains(e.target) && !feedPanel.contains(e.target)) feedPanel.classList.add('hidden');
        });

        feedSearch.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('.feed-item').forEach(item => {
                const labelText = item.querySelector('label').innerText.toLowerCase();
                item.style.display = labelText.includes(term) ? 'flex' : 'none';
            });
        });

        document.getElementById('feed-list').addEventListener('change', () => {
            const checkedCount = document.querySelectorAll('.feed-checkbox:checked').length;
            if (checkedCount === 0) feedBtnText.innerText = 'All Solutions (No Filter)';
            else if (checkedCount === 1) feedBtnText.innerText = '1 Solution Selected';
            else feedBtnText.innerText = `${checkedCount} Solutions Selected`;
        });

        // --- UPGRADED: Clear All Selections Logic ---
        feedClearBtn.addEventListener('click', (e) => {
            e.preventDefault(); 
            document.querySelectorAll('.feed-checkbox').forEach(cb => cb.checked = false);
            feedSearch.value = '';
            document.querySelectorAll('.feed-item').forEach(item => item.style.display = 'flex');
            document.getElementById('feed-list').dispatchEvent(new Event('change'));
        });

        function populateFeedSolutions() {
            log("Scanning database to extract unique Feed Solutions...");
            const tablesResult = dbInstance.exec("SELECT name FROM sqlite_master WHERE type='table';");
            if (tablesResult.length === 0) return;
            
            const allTables = tablesResult[0].values.map(row => row[0]);
            let uniqueFeeds = new Set();
            
            for (let tableName of allTables) {
                const dataResult = dbInstance.exec(`SELECT * FROM "${tableName}"`);
                if (dataResult.length === 0) continue;
                const values = dataResult[0].values;
                
                for (let r = 0; r < values.length; r++) {
                    for (let c = 0; c < values[r].length; c++) {
                        if (String(values[r][c]).toLowerCase().includes('feed solution')) {
                            if (c + 1 < values[r].length) {
                                let val = String(values[r][c+1]).trim();
                                if (val && val !== 'null') uniqueFeeds.add(val);
                            }
                        }
                    }
                }
            }
            
            const feedList = document.getElementById('feed-list');
            feedList.innerHTML = ''; 
            let sortedFeeds = Array.from(uniqueFeeds).sort();
            
            if (sortedFeeds.length === 0) {
                feedList.innerHTML = '<div class="text-sm text-slate-500 italic px-2">No feed solutions found in DB.</div>';
                feedBtnText.innerText = "No Solutions Found";
                return;
            }
            
            sortedFeeds.forEach(feed => {
                const safeFeed = feed.replace(/"/g, '&quot;');
                const div = document.createElement('div');
                div.className = 'flex items-center px-2 py-1 hover:bg-slate-100 rounded cursor-pointer feed-item';
                div.innerHTML = `
                    <input type="checkbox" value="${safeFeed}" class="feed-checkbox h-4 w-4 text-blue-600 focus:ring-blue-500 border-slate-300 rounded mr-2 cursor-pointer">
                    <label class="text-xs text-slate-700 truncate w-full cursor-pointer" title="${safeFeed}">${feed}</label>
                `;
                div.addEventListener('click', (e) => {
                    if(e.target.tagName !== 'INPUT') {
                        const cb = div.querySelector('input');
                        cb.checked = !cb.checked;
                        cb.dispatchEvent(new Event('change', { bubbles: true }));
                    }
                });
                feedList.appendChild(div);
            });
            
            feedBtnText.innerText = 'All Solutions (No Filter)';
            log(`Background scan complete. Extracted ${sortedFeeds.length} unique Feed Solutions.`, "success");
        }
    </script>
</body>
